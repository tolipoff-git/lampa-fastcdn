name: FastCDN checks
on:
  push:
    branches: [master, 'fix/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check fastcdn.js
      - run: node tests/regression.cjs
      - run: bash -n release.sh
